plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Push FCM : le fichier de configuration Firebase (android/app/google-services.json, hors Git) est fourni par le
// projet Firebase de Tratra. Sans lui l'application compile et fonctionne, simplement sans notifications push.
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}

// Les identifiants de signature restent hors du dépôt dans android/key.properties.
// Sans ce fichier, un build release reste volontairement non signé : il ne doit
// jamais retomber sur la clé de débogage.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { stream ->
        keystoreProperties.load(stream)
    }
}

android {
    namespace = "com.tratra"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        // Identifiant Android déjà utilisé par Tratra. Toute modification
        // nécessite une nouvelle application Play Store.
        applicationId = "com.tratra"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        // Nom affiché de l'application (surchargé pour la copie de recette, voir buildTypes.debug).
        manifestPlaceholders += [appLabel: "Tratra"]
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword = keystoreProperties['storePassword']
            }
        }
    }

    // Copie de recette installable À CÔTÉ d'une installation existante (sessions et données intactes) :
    //   TRATRA_APP_ID_SUFFIX=.recette flutter build apk --debug   (ou --release pour valider le build de production)
    // Sans la variable, aucun changement : l'identifiant reste com.tratra.
    def idSuffix = System.getenv("TRATRA_APP_ID_SUFFIX")

    buildTypes {
        debug {
            if (idSuffix) {
                applicationIdSuffix = idSuffix
                manifestPlaceholders += [appLabel: "Tratra Recette"]
            }
        }
        release {
            if (idSuffix) {
                applicationIdSuffix = idSuffix
                manifestPlaceholders += [appLabel: "Tratra Recette"]
            }
            // Ne configure la signature release que si la clé fournie hors Git
            // est disponible. Un artefact sans key.properties ne peut donc pas
            // être publié accidentellement avec la clé debug.
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            }
        }
    }
}

flutter {
    source = "../.."
}
