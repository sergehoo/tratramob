name: flutter_tratra
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_rating_bar: ^4.0.1
  intl: ^0.20.2
  carousel_slider: ^5.1.1
  flutter_svg: ^2.2.0
  shimmer: ^3.0.0
  cached_network_image: ^3.2.3
  provider: ^6.0.5
  geolocator: ^14.0.2
  http: ^1.5.0
  shared_preferences: ^2.5.3
  share_plus: ^12.0.0
  chewie: ^1.13.0
  video_player: ^2.10.0
  flutter_secure_storage: ^9.2.4
  font_awesome_flutter: ^10.7.0
  url_launcher: ^6.3.2
  image_picker: ^1.1.2
  mobile_scanner: ^7.4.2
  path_provider: ^2.1.6
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  web_socket_channel: ^3.0.3
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  stream_channel: ^2.1.4
  # (optionnel) si tu génères les icônes/splash :
  # flutter_launcher_icons: ^0.13.1
  # flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  # Polices de la marque, embarquées (SIL OFL — voir assets/fonts/OFL-*.txt).
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    # Script de marque : nom « Tratra » uniquement. Licence commerciale requise avant
    # production — voir frontend/design-system/BONSKIN-LICENCE.md (dépôt tratra).
    - family: Kaushan Script
      fonts:
        - asset: assets/fonts/KaushanScript-Regular.ttf
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Variable.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Variable.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-Variable.ttf
          weight: 800
  # <= DOIT être ici, sous "flutter:"
  assets:
    - assets/images/   # contient le logo officiel tratra_logo.webp (copie de frontend/public/tratra_logo.webp)
    - assets/icons/
    - assets/handy.sqlite
    # - assets/images/logo_dark.png

# Configs outils (facultatives) — laisses-les ICI, hors de "flutter:"
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/tratra_logo.webp
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/tratra_logo.webp

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#000000"
  image: assets/images/tratra_logo.webp
  image_dark: assets/images/tratra_logo.webp
  android_12:
    color: "#FFFFFF"
    color_dark: "#000000"
    image: assets/images/tratra_logo.webp
    image_dark: assets/images/tratra_logo.webp